# The web image, built on a tag and pushed to the registry that comes with the
# repository.
#
# No secret is configured beyond the built-in `GITHUB_TOKEN`: `packages: write`
# is what lets it push to ghcr.io, and there is nothing else to rotate, leak or
# forget. A registry credential in this repository's settings would be a fourth
# thing to look after for no capability this does not already have.
#
# The context is the repository root, not `web/`. The server is a front end over
# `bin/report-maker`, so the engine has to be in the context — and docker reads
# its ignore file from the context root, which is why `.dockerignore` lives
# there and says so.

name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # buildx would otherwise fail with a path error four steps from here.
      # This says the true thing instead.
      - name: Confirm there is a Dockerfile to build
        run: |
          test -f web/Dockerfile || {
            echo "::error::web/Dockerfile is missing. The web image is described in" \
                 "web/README.md under 'Deploying': python:3.12-slim plus the typst" \
                 "binary, a non-root user and a healthcheck, built with the" \
                 "repository root as its context."
            exit 1
          }

      - uses: docker/setup-buildx-action@v4

      # Only for a real publish. A workflow_dispatch run builds and throws the
      # image away, which is the useful half of a dry run.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # `/web` because this repository ships more than one thing; the
          # desktop app is packaged by electron-builder and never lands here.
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=report-maker web
            org.opencontainers.image.description=report-maker in a browser — a session vault, a build, and a share link that carries the evidence
            org.opencontainers.image.licenses=NOASSERTION

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tags go through the environment rather than into the script text:
      # they are derived from a git tag, and a git tag is somebody's input.
      - name: Say where it went
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            echo
            echo "Set \`RM_WEB_ROOT\` to a real volume and \`RM_WEB_SECURE_COOKIE=1\`"
            echo "behind TLS before this is reachable from anywhere but a laptop."
            echo "See web/README.md, 'Deploying'."
          } >> "$GITHUB_STEP_SUMMARY"
