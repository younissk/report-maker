# The gate.
#
# Three things run here, and one of them is the reason the file exists.
#
#   suite      the engine's tests, the web server's tests, and the demo vault
#              built end to end — on Linux and on macOS, because the engine
#              looks for fonts and applications in places only one of them has.
#   frontends  the desktop app and the web client typechecked and bundled.
#   link-rot   weekly, not per-push: re-fetch every page the demo vault cites
#              and fail when one is gone. See the job for why that is the point.
#
# `push` is narrowed to `main` on purpose: a branch gets its run through its pull
# request, and running both events on every branch doubles the bill for one
# answer. Push a branch with no PR and reach for `workflow_dispatch`.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday, 06:00 UTC — the link-rot job, and nothing else.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `event_name` is in the key so a push to main cannot cancel the weekly
  # link-rot run, which is the one job here that nothing else repeats.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned, because a document is a rendering and not a value: two Typst
  # releases can paginate or hyphenate differently, and `tests/test_render.py`
  # grades a perceptual hash of page 1. This pin is also in pages.yml; the two
  # have to move together.
  TYPST_VERSION: '0.15.1'
  # The declared floor in README.md ("Python 3.11+"). Testing the floor is the
  # only version test worth having when there are no dependencies to conflict.
  #
  # Deliberately a minor version and not an exact one, which means the two
  # runner images resolve it to whatever patch release they have cached: on
  # 2026-08-25 that was 3.11.16 on ubuntu and 3.11.9 on macOS. That is not
  # tidy, and it is the reason a real bug was caught rather than shipped —
  # CPython changed both what `ipaddress`'s predicates answer for an
  # IPv4-mapped address and how `str()` spells one between those two releases,
  # and `web/server/security.py` was letting the envelope's predicates choose
  # the words of an SSRF refusal. A repository that claims "3.11+" is claiming
  # every 3.11.x, so the floating patch is the claim being tested. Pin it only
  # when a run has to be reproducible byte for byte, and know what is being
  # given up.
  PYTHON_VERSION: '3.11'
  # Pinned for the same reason Typst is. Node is not a dependency of the engine,
  # but it is a dependency of what the engine renders: `report-maker diagrams`
  # installs mermaid-cli and runs it, and a mermaid that renders differently
  # changes a figure in a report. The runner's default Node moved from 20 to 24
  # under this repository without a commit of ours, and an unpinned toolchain is
  # a variable in every result the matrix reports.
  NODE_VERSION: '22'

jobs:
  suite:
    name: suite (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # This job has no JavaScript of its own, and needs Node anyway: the demo
      # vault has a diagram, and `report-maker all` renders it by installing
      # mermaid-cli into the vault's .build/ and running it. Without this the
      # engine picks up whatever Node the image happens to ship, which is the
      # one part of the toolchain that was moving on its own.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Straight from the release, rather than through a third-party action:
      # the pin is then visible in this file and there is no second supply
      # chain to trust for the one binary the whole build depends on.
      - name: Install Typst ${{ env.TYPST_VERSION }}
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)    asset=typst-x86_64-unknown-linux-musl ;;
            Linux-ARM64)  asset=typst-aarch64-unknown-linux-musl ;;
            macOS-ARM64)  asset=typst-aarch64-apple-darwin ;;
            macOS-X64)    asset=typst-x86_64-apple-darwin ;;
            *) echo "::error::no Typst build for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${asset}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o typst.tar.xz
          tar -xf typst.tar.xz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "${asset}/typst" "$HOME/.local/bin/typst"
          rm -rf typst.tar.xz "${asset}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm the toolchain
        run: |
          typst --version
          python3 --version
          ./bin/report-maker --version
          ./bin/report-maker -C examples/demo-vault doctor

      # `report-maker all` renders diagrams as its second step, and the engine
      # installs mermaid-cli on demand into the vault's .build/ — 190 packages
      # on a cold run. The key is the file the version is pinned in, so a bump
      # invalidates it and nothing else does. A miss is slow, never wrong: the
      # engine reinstalls, and a failure to render is caught and skipped.
      - name: Cache mermaid-cli
        uses: actions/cache@v6
        with:
          path: examples/demo-vault/.build/mermaid
          key: mermaid-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('engine/config.py', 'examples/demo-vault/report-maker.toml') }}

      # RESOLVED 2026-08-25, and worth knowing before anyone reads a skip in
      # tests/test_render.py as this rule going soft. This step used to fail on
      # ubuntu-latest for fonts rather than code: the demo vault's brand pack
      # asks for Didot, Helvetica Neue and Menlo — macOS system faces with no
      # Linux equivalent — so Typst substitutes here and page 1 legitimately
      # lands 13 bits from a hash that was recorded on a Mac, against a
      # tolerance of 6. The golden hashes are now recorded per platform, under
      # `tests/golden/<sys.platform>/`, which was the first of the two honest
      # fixes named here. The tolerance was NOT widened: one wide enough to span
      # two font stacks is wide enough to miss the design change the test
      # exists to catch.
      #
      # The module additionally skips when the brand's first-choice families are
      # absent, which is this runner. That is "this machine cannot answer",
      # not a suppression: with those faces missing the hash stops responding to
      # the brand at all — editing `fonts.display` would not move a bit — so a
      # pass would be structurally blind to the change being gated, and a false
      # green is worse than a skip. It is the same shape as the skipUnless(TYPST)
      # already in the module.
      #
      # The second honest fix is still open, and it is the one that makes this
      # leg earn its keep: move the brand pack onto faces Typst embeds
      # (Libertinus Serif, New Computer Modern, DejaVu Sans Mono). Then both
      # platforms render the same page, one golden serves everywhere, and the
      # font skip stops firing. That is a design decision about how every report
      # in the repository looks, not a CI fix, which is why it is not done here.
      - name: Engine tests
        run: make test

      - name: Web tests
        run: python3 -m unittest discover -s web/tests

      # The end-to-end proof: stage, diagrams, build, pages, manifest, check.
      # `check` is last and non-zero on any finding, so this is the citation
      # rule enforced against a real vault rather than against a fixture.
      - name: Build the demo vault
        shell: bash
        run: |
          set +e
          ./bin/report-maker -C examples/demo-vault all
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::report-maker all exited $code on examples/demo-vault"
            exit "$code"
          fi
          echo "report-maker all exited 0"

      # test_render tells you to go and look at the page. This is how you can.
      - name: Keep the rendered pages when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-pages-${{ matrix.os }}
          path: |
            examples/demo-vault/.build/golden-pages/**
            examples/demo-vault/out/pages/**
          if-no-files-found: ignore
          retention-days: 7

  frontends:
    name: app + web client
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web/client/package-lock.json

      # `electron-vite build` typechecks and bundles; it never launches
      # Electron, so the ~100 MB binary download buys nothing here. Drop this
      # line if a build ever turns out to need it.
      - name: Desktop app — typecheck and bundle
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build

      - name: Web client — typecheck and bundle
        working-directory: web/client
        run: |
          npm ci
          npm run build

  link-rot:
    name: link rot
    # Weekly and on demand, never per-push: this job makes a real request for
    # every archived source, and doing that on every commit is both slow and
    # rude to the sites being cited.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No Typst: nothing is compiled here. `verify` re-fetches the pages the
      # vault cites and compares them against what was archived.
      - name: Re-fetch every archived source
        id: verify
        shell: bash
        run: |
          set +e
          ./bin/report-maker -C examples/demo-vault verify --json > verify.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat verify.json

      - name: Read the drift
        id: drift
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib

          data = json.loads(pathlib.Path("verify.json").read_text(encoding="utf-8"))
          counts = data.get("counts", {})
          drifts = data.get("drifts", [])

          # Every state the engine defines, worst first — the same order
          # `verify` prints them in.
          states = ("gone", "error", "changed", "unsnapshotted", "offline", "ok")
          for state in states:
              print(f"{state}={counts.get(state, 0)}")

          archived = sum(counts.get(s, 0) for s in ("gone", "error", "changed", "ok"))
          print(f"archived={archived}")

          # A detail carries a URL and whatever the far end said, so the one
          # character that would break the table out of its own column is
          # escaped before it gets there.
          def cell(value):
              return str(value).replace("|", "\\|")

          rows = "\n".join(
              f"| `{cell(d['state'])}` | {cell(d['report'])} "
              f"| `@{cell(d['key'])}` | {cell(d['detail'])} |"
              for d in sorted(drifts, key=lambda d: states.index(d["state"]))
          )
          summary = [
              "## Link rot — `report-maker verify` over `examples/demo-vault`",
              "",
              "A page *changing* is not a failure: the snapshot is still evidence and",
              "the report is still defensible because of it. A page that is **gone**",
              "is the failure, and it is the one this job exists to catch.",
              "",
              "| state | report | key | detail |",
              "|---|---|---|---|",
              rows or "| — | — | — | nothing archived |",
          ]
          if archived == 0:
              summary += [
                  "",
                  "> **This gate cannot fail yet.** No source in the demo vault has a",
                  "> snapshot, so there is nothing to re-fetch and `verify` returns 0",
                  "> whatever the web does. Run `report-maker cite` on the vault's",
                  "> sources to give this job something to watch.",
              ]
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary) + "\n", encoding="utf-8"
          )
          PY

      - name: No source is archived
        if: steps.drift.outputs.archived == '0'
        run: |
          echo "::warning::examples/demo-vault has no archived snapshots, so this job" \
               "cannot detect link rot. Run report-maker cite on its sources."

      # A page moved. The archive still holds the bytes the report rests on, so
      # this step goes red and the job stays green — `continue-on-error` is the
      # workflow's spelling of the engine's own exit-code rule: only `gone`
      # fails the command.
      - name: A cited page has changed
        continue-on-error: true
        env:
          CHANGED: ${{ steps.drift.outputs.changed }}
          ERRORED: ${{ steps.drift.outputs.error }}
        shell: bash
        run: |
          if [ "$CHANGED" != "0" ] || [ "$ERRORED" != "0" ]; then
            echo "::warning::$CHANGED cited page(s) have changed and $ERRORED could not be fetched." \
                 "Re-read the claims that rest on them; re-archive with report-maker verify --refresh."
            exit 1
          fi
          echo "every archived page is byte-identical to the day it was cited"

      # A page is gone. This is the whole point of having archived it, and the
      # whole point of this file: a citation that resolves to a dead link
      # proves nothing, and nothing else in the build would ever say so.
      - name: A cited page is gone
        env:
          GONE: ${{ steps.drift.outputs.gone }}
          CODE: ${{ steps.verify.outputs.code }}
        shell: bash
        run: |
          if [ "$GONE" != "0" ]; then
            echo "::error::$GONE cited page(s) are gone — 404 or 410." \
                 "The snapshot in the report folder is now the only copy that exists."
            exit 1
          fi
          if [ "$CODE" != "0" ]; then
            echo "::error::report-maker verify exited $CODE"
            exit 1
          fi
          echo "no dead links"
