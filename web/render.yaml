# report-maker web on Render — a worked example, not a template to paste blind.
#
# Render reads a Blueprint from the REPOSITORY ROOT by default. This file lives
# in `web/`, so point the Blueprint at it explicitly when you create it, or
# copy it to `/render.yaml`. Either way `dockerContext: .` stays as it is: the
# image carries `engine/` and `bin/report-maker` as well as the server, so the
# build context has to be the repository, not `web/`.
#
# ── ONE INSTANCE. This is a constraint, not a suggestion. ────────────────────
#
# `web/README.md` item 5: the rate limiter and the per-session command tally
# live in memory. A second instance doubles every limit and cannot see the
# first one's sessions — their vaults are on a disk only one instance mounts.
# Attaching a disk pins the service to one instance, which is why the disk
# below is doing two jobs. Do not turn on autoscaling.

services:
  - type: web
    name: report-maker-web
    runtime: docker
    plan: starter          # 512 MB will OOM typst on a real report — see below
    region: frankfurt
    branch: main

    dockerfilePath: ./web/Dockerfile
    dockerContext: .

    # `/api/health` answers `{ok, version, diagrams, github}` and never a path,
    # so a public probe against it publishes nothing about the instance.
    healthCheckPath: /api/health

    autoDeploy: true

    disk:
      # `RM_WEB_ROOT`. Without it every session vault and — worse — every share
      # link ever handed out lives in the container filesystem, which Render
      # replaces on each deploy. A share is meant to still open after you
      # closed the tab.
      name: report-maker-data
      mountPath: /var/lib/report-maker
      sizeGB: 10

    envVars:
      # Render injects PORT and looks for a listener on it. The server takes
      # its port from RM_WEB_PORT, so both are set and both say 8787.
      - key: PORT
        value: "8787"
      - key: RM_WEB_PORT
        value: "8787"

      # The store, and it must be the disk mount above.
      #
      # Long and project-specific rather than `/data`, and that is
      # load-bearing: the server strips this prefix out of every JSON string
      # on the way out, file text included, so a short root corrupts reports
      # that happen to contain it. See the measured note in `web/Dockerfile`.
      - key: RM_WEB_ROOT
        value: /var/lib/report-maker

      # Render terminates TLS, so the session cookie must carry `Secure`.
      # Without this it travels in the clear to anyone who can downgrade a
      # request.
      - key: RM_WEB_SECURE_COOKIE
        value: "1"

      # Thirty days. `0` keeps share links for ever — they are immutable by
      # design, so deleting the file is the only revocation, and the disk is
      # then yours to watch.
      - key: RM_WEB_SHARE_TTL_HOURS
        value: "720"

      # ── GitHub mode ───────────────────────────────────────────────────────
      #
      # `sync: false` means "Render prompts for this in the dashboard and does
      # NOT read it from this file" — which is the only correct handling for a
      # secret in a committed Blueprint. Nothing here ever reaches the browser:
      # a token lives in the server-side session record only.
      #
      # The callback must match the Authorization callback URL on the GitHub
      # OAuth app exactly, scheme and all:
      #     https://<your-service>.onrender.com/api/github/callback
      #
      # LEAVING THESE UNSET IS A SUPPORTED CONFIGURATION, not a broken one.
      # GitHub mode is simply OFF: the UI says so plainly rather than showing
      # a dead button, and try mode — the default experience, and the reason
      # to deploy this at all — is unaffected. Skip every prompt below and the
      # service still works.
      - key: RM_WEB_GITHUB_CLIENT_ID
        sync: false
      - key: RM_WEB_GITHUB_CLIENT_SECRET
        sync: false
      - key: RM_WEB_GITHUB_CALLBACK
        sync: false

      # A single-user, self-hosted alternative to the OAuth app above: one
      # personal access token, server side, never a field in the UI. Use this
      # OR the three above, not both.
      - key: RM_WEB_GITHUB_TOKEN
        sync: false

      # `report-maker sync` runs `git commit`, and git refuses to commit with
      # no identity. Set these if you turn GitHub mode on. They are not
      # defaulted on purpose: a commit attributed to a plausible-looking name
      # nobody chose is a false statement in the one place this project treats
      # as a record.
      - key: GIT_AUTHOR_NAME
        sync: false
      - key: GIT_AUTHOR_EMAIL
        sync: false
      - key: GIT_COMMITTER_NAME
        sync: false
      - key: GIT_COMMITTER_EMAIL
        sync: false

      # NOT listed, deliberately: RM_WEB_DIAGRAMS. It drives mermaid, which
      # drives a headless Chrome per render — the largest attack surface in
      # the tool and a trivial denial of service. The runtime image has no
      # node in it at all, so setting it here would not turn diagrams on
      # anyway; it would need a different image, built on purpose.

# ── a note on `plan` ─────────────────────────────────────────────────────────
#
# `starter` is 512 MB. typst holds a rendered document in memory and this
# server compiles source a stranger wrote, so a long report with images will
# OOM there — and an OOM kill looks to the writer like a build that hung, not
# like a limit that was hit. Move to `standard` (2 GB) before inviting anyone.
# The 60-second per-command deadline is the other half of this and is enforced
# in the server, not by the plan.
